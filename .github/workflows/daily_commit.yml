name: Dynamic Daily Commits

# Fills the contribution graph so that the empty days spell "KRUZEE".
# The pattern lives in .github/scripts/kruzee_pattern.py.
# It runs three times a day so a dropped scheduled run doesn't leave a hole.
# Only the first successful run each UTC day makes commits.
on:
  schedule:
    - cron: "5 0 * * *"
    - cron: "5 8 * * *"
    - cron: "5 16 * * *"
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

concurrency:
  group: daily-commit
  cancel-in-progress: false

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 200 # enough history to see today's bot commits

      - name: Set up Git identity
        run: |
          git config --global user.email "123106006+kruzxee@users.noreply.github.com"
          git config --global user.name "GitHub Commit Bot"

      - name: Make today's commits
        env:
          TZ: UTC
        run: |
          TODAY=$(date +'%Y-%m-%d')

          if git log --author="GitHub Commit Bot" --date=format-local:%Y-%m-%d --format=%ad | grep -qx "$TODAY"; then
            echo "Already committed for $TODAY, nothing to do."
            exit 0
          fi

          NUM_COMMITS=$(python3 .github/scripts/kruzee_pattern.py --date "$TODAY")
          echo "Date: $TODAY"
          echo "Total Commits: $NUM_COMMITS"

          if [ "$NUM_COMMITS" -eq 0 ]; then
            echo "$TODAY is part of a letter, leaving it empty."
            exit 0
          fi

          for i in $(seq 1 $NUM_COMMITS); do
            RANDOM_NUMBER=$((RANDOM % 1000))
            TIMESTAMP=$(TZ="America/New_York" date +"%Y-%m-%d %H:%M:%S %Z")
            COMMIT_MESSAGE="Auto Commit #$i on $TIMESTAMP with value: $RANDOM_NUMBER"
            echo "$COMMIT_MESSAGE" > auto_commit_log.txt
            git add auto_commit_log.txt
            git commit -m "$COMMIT_MESSAGE"
          done

      - name: Push changes
        run: |
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
