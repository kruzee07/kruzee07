name: Generate trading chart

# Draws an animated daily candlestick chart from the contribution calendar
# and publishes it to the output branch, which the README displays.
on:
  workflow_run:
    workflows: ["Dynamic Daily Commits"]
    types: [completed]
  schedule:
    - cron: "30 2 * * *" # fallback if the commit workflow didn't run
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-chart
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Draw chart
        run: python3 .github/scripts/trading_chart.py --login "${{ github.repository_owner }}" --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
